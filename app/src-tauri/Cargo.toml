[package]
name = "lumbridge-mobile"
version = "0.1.0"
edition = "2021"
description = "The Lumbridge Mobile app shell (Tauri) for Android and iPhone."
license = "Apache-2.0"
repository = "https://github.com/lumbridge-corp/lumbridge-mobile"
homepage = "https://lumbridgecorp.com"
publish = false

[lib]
name = "lumbridge_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
